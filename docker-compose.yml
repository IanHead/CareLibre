name: carelibre

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carelibre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carelibre}
      POSTGRES_DB: ${POSTGRES_DB:-carelibre}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - carelibre-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-carelibre}:${POSTGRES_PASSWORD:-carelibre}@postgres:5432/${POSTGRES_DB:-carelibre}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      RUN_MIGRATIONS: "true"
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-please-32-chars}
      ACCESS_TOKEN_TTL_SECS: ${ACCESS_TOKEN_TTL_SECS:-900}
      REFRESH_TOKEN_TTL_SECS: ${REFRESH_TOKEN_TTL_SECS:-2592000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-info,carelibre_server=info,tower_http=info,sqlx=warn}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  carelibre-postgres:
