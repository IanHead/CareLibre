name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carelibre
          POSTGRES_PASSWORD: carelibre
          POSTGRES_DB: carelibre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carelibre -d carelibre"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://carelibre:carelibre@localhost:5432/carelibre
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Validate migrations
        run: |
          cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
          sqlx migrate run --source migrations

      - name: Schema integration tests
        run: cargo test --workspace --all-targets -- --ignored

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag carelibre-server:ci .
